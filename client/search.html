<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Events | GreatLove Events</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Header + Nav (common, rendered once in common.js) ===== -->
  <header class="site-header" id="site-header"></header>

  <!-- ===== Body (page-specific content) ===== -->
  <main class="container">
    <h2 class="page-title">Search Charity Events</h2>
    <p class="page-subtitle">Filter events by date, location and category. Leave a field empty to ignore it.</p>

    <!-- Filter form -->
    <form class="filter-form" id="search-form">
      <div class="form-group">
        <label for="date">Date</label>
        <input type="text" id="date" name="date" placeholder="YYYY-MM-DD">
      </div>
      <div class="form-group">
        <label for="location">Location / District</label>
        <input type="text" id="location" name="location" placeholder="e.g. Yufeng">
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category">
          <option value="">All categories</option>
          <!-- categories are loaded from the API -->
        </select>
      </div>
    </form>

    <div class="form-actions">
      <button class="btn" id="search-btn" type="button">Search</button>
      <button class="btn btn-ghost" id="clear-btn" type="button">Clear Filters</button>
    </div>

    <!-- Error / status messages -->
    <div id="message"></div>

    <!-- Search results -->
    <div id="results" class="card-grid"></div>
  </main>

  <!-- ===== Footer (common, rendered once in common.js) ===== -->
  <footer id="site-footer"></footer>

  <script src="js/common.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
